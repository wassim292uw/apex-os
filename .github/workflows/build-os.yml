name: Build Custom Ubuntu ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Building Tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools \
          isolinux syslinux-utils ubuntu-keyring

    - name: Create Base Ubuntu RootFS
      run: |
        mkdir -p build/rootfs
        sudo debootstrap --arch=amd64 --no-check-gpg jammy build/rootfs http://archive.ubuntu.com/ubuntu/ || true

    - name: Configure Inside RootFS
      run: |
        sudo mount --bind /dev build/rootfs/dev
        sudo mount --bind /proc build/rootfs/proc
        sudo mount --bind /sys build/rootfs/sys

        cat << 'EOF' | sudo chroot build/rootfs /bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update --fix-missing || true
        apt-get install -y --no-install-recommends linux-generic casper xorg xfce4 lightdm || true
        
        echo "apex-os" > /etc/hostname
        echo "PRETTY_NAME=\"Apex OS Linux\"" > /etc/os-release
        
        apt-get clean
        EOF

        sudo umount -l build/rootfs/dev || true
        sudo umount -l build/rootfs/proc || true
        sudo umount -l build/rootfs/sys || true

    - name: Pack RootFS into SquashFS
      run: |
        mkdir -p build/iso/casper
        sudo mksquashfs build/rootfs build/iso/casper/filesystem.squashfs -comp xz
        
        sudo cp $(ls -1 build/rootfs/boot/vmlinuz-* | head -n 1) build/iso/casper/vmlinuz || true
        sudo cp $(ls -1 build/rootfs/boot/initrd.img-* | head -n 1) build/iso/casper/initrd.img || true

    - name: Create GRUB Boot Menu
      run: |
        mkdir -p build/iso/boot/grub
        cat << 'EOF' > build/iso/boot/grub/grub.cfg
        set default=0
        set timeout=10

        menuentry "Apex OS (Live ISO)" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd.img
        }
        EOF

    - name: Generate Final Live ISO Image
      run: |
        grub-mkrescue -o ApexOS-Live.iso build/iso

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ApexOS-Live-ISO
        path: ApexOS-Live.iso
